<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Stok & Harga - UD. BAROKAH JAYA MAKMUR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Firebase SDK (Modular CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Konfigurasi Firebase Milikmu
    const firebaseConfig = {
      apiKey: "AIzaSyAo7sjnRiwg7Yr1pJa38tEQVNHJhzYMqZ0",
      authDomain: "stok-barokah.firebaseapp.com",
      databaseURL: "https://stok-barokah-default-rtdb.firebaseio.com",
      projectId: "stok-barokah",
      storageBucket: "stok-barokah.firebasestorage.app",
      messagingSenderId: "712505680991",
      appId: "1:712505680991:web:73bb75b9122e9c02c067ea",
      measurementId: "G-F0MPCNWDCC"
    };

    // Inisialisasi Firebase & Realtime Database
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Referensi Database
    const itemsRef = ref(db, 'items');
    const historyRef = ref(db, 'history');

    // Variable Global State
    window.items = [];
    window.historyLog = [];
    window.selectedCategory = 'All';

    // Format Rupiah
    window.formatRupiah = function(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    };

    // Sinkronisasi Realtime Data Barang dari Firebase
    onValue(itemsRef, (snapshot) => {
      const data = snapshot.val();
      window.items = [];
      if (data) {
        Object.keys(data).forEach(key => {
          window.items.push({ id: key, ...data[key] });
        });
      }
      renderItems();
      updateStats();
    });

    // Sinkronisasi Realtime Riwayat dari Firebase
    onValue(historyRef, (snapshot) => {
      const data = snapshot.val();
      window.historyLog = [];
      if (data) {
        Object.keys(data).forEach(key => {
          window.historyLog.unshift({ id: key, ...data[key] });
        });
      }
      renderHistory();
    });

    // Tambah Barang Baru ke Firebase
    window.handleAddItem = function(e) {
      e.preventDefault();
      const name = document.getElementById('newItemName').value;
      const category = document.getElementById('newItemCategory').value;
      const price = parseInt(document.getElementById('newItemPrice').value);
      const stock = parseInt(document.getElementById('newItemStock').value);
      const unit = document.getElementById('newItemUnit').value;

      const newItemRef = push(ref(db, 'items'));
      set(newItemRef, { name, category, price, stock, unit })
        .then(() => {
          closeAddModal();
        })
        .catch(err => alert("Gagal menyimpan data: " + err.message));
    };

    // Ubah Stok Barang (Custom Input)
    window.changeStockCustom = function(id, type) {
      const item = window.items.find(i => i.id === id);
      if (!item) return;

      const titleText = type === 'in' ? `Tambah Stok ${item.name}` : `Kurangi Stok ${item.name}`;
      const inputVal = prompt(`${titleText}\nMasukkan jumlah (${item.unit}):`, "1");

      if (inputVal === null) return;
      
      const qty = parseInt(inputVal);
      if (isNaN(qty) || qty <= 0) {
        alert("Harap masukkan angka jumlah yang valid!");
        return;
      }

      let newStock = item.stock;
      if (type === 'out') {
        if (item.stock - qty < 0) {
          alert(`Stok tidak cukup! Stok saat ini hanya tersisa ${item.stock} ${item.unit}.`);
          return;
        }
        newStock -= qty;
      } else {
        newStock += qty;
      }

      // Update Stok ke Firebase
      set(ref(db, `items/${id}/stock`), newStock);

      // Catat Riwayat ke Firebase
      const now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      const actionText = type === 'in' ? `+${qty} ${item.unit} (Stok Masuk)` : `-${qty} ${item.unit} (Terjual/Keluar)`;
      
      push(ref(db, 'history'), {
        time: now,
        text: `<b>${item.name}</b>: ${actionText}`,
        type: type
      });
    };

    // Edit Harga Barang
    window.editPrice = function(id) {
      const item = window.items.find(i => i.id === id);
      if (!item) return;

      const newPrice = prompt(`Masukkan harga baru untuk ${item.name} (per ${item.unit}):`, item.price);
      if (newPrice !== null && !isNaN(newPrice) && newPrice !== "") {
        set(ref(db, `items/${id}/price`), parseInt(newPrice));
      }
    };

    // Hapus Barang
    window.deleteItem = function(id) {
      if (confirm('Yakin ingin menghapus barang ini secara permanen dari Cloud Database?')) {
        remove(ref(db, `items/${id}`));
      }
    };

    // Hapus Log Riwayat
    window.clearHistory = function() {
      if (confirm('Hapus semua catatan riwayat dari Cloud Database?')) {
        remove(ref(db, 'history'));
      }
    };
  </script>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-12">

  <!-- Header Store -->
  <header class="bg-amber-600 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="font-black text-lg tracking-wide uppercase leading-tight">UD. BAROKAH JAYA MAKMUR</h1>
        <p class="text-xs text-amber-100 flex items-center gap-1 mt-0.5">
          <i class="fa-solid fa-cloud"></i> Cloud Stok & Harga (Firebase)
        </p>
      </div>
      <button onclick="openAddModal()" class="bg-amber-800 hover:bg-amber-900 text-white text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-plus"></i> Barang Baru
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

    <!-- Ringkasan Statistik -->
    <div class="grid grid-cols-2 gap-2">
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center">
        <span class="text-xs text-slate-500 block">Total Jenis Barang</span>
        <span id="statTotalItem" class="text-lg font-bold text-slate-800">0</span>
      </div>
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center">
        <span class="text-xs text-slate-500 block">Stok Menipis</span>
        <span id="statLowStock" class="text-lg font-bold text-red-600">0</span>
      </div>
    </div>
    <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 flex justify-between items-center">
      <div>
        <span class="text-xs text-amber-800 font-medium block">Total Estimasi Nilai Stok</span>
        <span id="statTotalValue" class="text-base font-black text-amber-900">Rp 0</span>
      </div>
      <i class="fa-solid fa-wallet text-amber-600 text-xl"></i>
    </div>

    <!-- Filter & Search -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-2">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="renderItems()" placeholder="Cari material..." 
               class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>
      <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
        <button onclick="filterCategory('All')" class="cat-btn bg-amber-600 text-white px-3 py-1.5 rounded-full font-medium whitespace-nowrap">Semua</button>
        <button onclick="filterCategory('Material')" class="cat-btn bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full font-medium whitespace-nowrap">Material / Besi</button>
        <button onclick="filterCategory('Elektronik')" class="cat-btn bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full font-medium whitespace-nowrap">Elektronik</button>
      </div>
    </div>

    <!-- Daftar Stok Barang -->
    <div id="itemList" class="space-y-3">
      <!-- Item Card Render In JS -->
    </div>

    <!-- Riwayat Transaksi -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mt-6">
      <h3 class="font-bold text-slate-800 text-sm mb-3 flex items-center justify-between">
        <span><i class="fa-solid fa-clock-rotate-left text-amber-600 mr-1.5"></i> Riwayat Transaksi</span>
        <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline">Hapus Log</button>
      </h3>
      <ul id="historyList" class="space-y-2 text-xs max-h-48 overflow-y-auto pr-1">
        <li class="text-slate-400 italic text-center py-2">Belum ada riwayat transaksi.</li>
      </ul>
    </div>

  </main>

  <!-- Modal Tambah Barang Baru -->
  <div id="addModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800">Tambah Barang Baru</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="addForm" onsubmit="handleAddItem(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-600 font-medium mb-1">Nama Barang / Material</label>
          <input type="text" id="newItemName" required placeholder="Contoh: Besi Siku Bekas" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500">
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">Kategori</label>
          <select id="newItemCategory" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 bg-white">
            <option value="Material">Material / Besi</option>
            <option value="Elektronik">Elektronik</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-600 font-medium mb-1">Harga (Rp)</label>
            <input type="number" id="newItemPrice" min="0" required placeholder="0" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500">
          </div>
          <div>
            <label class="block text-slate-600 font-medium mb-1">Satuan</label>
            <input type="text" id="newItemUnit" required placeholder="Kg / Batang / Lembar" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500">
          </div>
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">Stok Awal</label>
          <input type="number" id="newItemStock" min="0" required placeholder="0" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeAddModal()" class="w-1/2 py-2.5 bg-slate-100 text-slate-600 rounded-lg font-medium">Batal</button>
          <button type="submit" class="w-1/2 py-2.5 bg-amber-600 text-white rounded-lg font-medium shadow hover:bg-amber-700">Simpan Barang</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function updateStats() {
      document.getElementById('statTotalItem').innerText = window.items.length;
      document.getElementById('statLowStock').innerText = window.items.filter(i => i.stock <= 5).length;
      
      const totalVal = window.items.reduce((sum, item) => sum + (item.price * item.stock), 0);
      document.getElementById('statTotalValue').innerText = formatRupiah(totalVal);
    }

    function filterCategory(cat) {
      window.selectedCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if(btn.innerText.includes(cat) || (cat==='All' && btn.innerText==='Semua')) {
          btn.className = "cat-btn bg-amber-600 text-white px-3 py-1.5 rounded-full font-medium whitespace-nowrap";
        } else {
          btn.className = "cat-btn bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full font-medium whitespace-nowrap";
        }
      });
      renderItems();
    }

    function renderItems() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const listEl = document.getElementById('itemList');
      listEl.innerHTML = '';

      const filtered = window.items.filter(item => {
        const matchCat = window.selectedCategory === 'All' || item.category === window.selectedCategory;
        const matchQuery = item.name.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-300 p-4">
            <i class="fa-solid fa-cloud-arrow-up text-slate-300 text-3xl mb-2"></i>
            <p class="text-slate-500 text-xs font-medium">Belum ada data barang di Cloud Database.</p>
            <p class="text-slate-400 text-[11px] mt-0.5">Klik "+ Barang Baru" untuk menambah stok pertama.</p>
          </div>`;
        return;
      }

      filtered.forEach(item => {
        let statusBadge = '';
        if (item.stock === 0) {
          statusBadge = `<span class="bg-red-100 text-red-700 text-[10px] px-2 py-0.5 rounded font-semibold">Habis</span>`;
        } else if (item.stock <= 5) {
          statusBadge = `<span class="bg-amber-100 text-amber-700 text-[10px] px-2 py-0.5 rounded font-semibold">Stok Menipis</span>`;
        } else {
          statusBadge = `<span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded font-semibold">Aman</span>`;
        }

        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between gap-3";
        card.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">${item.category}</span>
              ${statusBadge}
            </div>
            <h4 class="font-bold text-slate-800 text-sm truncate">${item.name}</h4>
            <div class="flex items-center gap-1.5 mt-0.5">
              <span class="text-xs font-bold text-amber-600">${formatRupiah(item.price)}</span>
              <span class="text-[11px] text-slate-400">/ ${item.unit}</span>
              <button onclick="editPrice('${item.id}')" class="text-slate-400 hover:text-amber-600 text-[11px] ml-1" title="Ubah Harga">
                <i class="fa-solid fa-pen"></i>
              </button>
            </div>
            <p class="text-xs text-slate-500 mt-1">Sisa Stok: <span class="font-bold text-slate-800">${item.stock}</span> ${item.unit}</p>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="changeStockCustom('${item.id}', 'out')" class="w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 font-bold flex items-center justify-center transition" title="Kurangi Stok">
              <i class="fa-solid fa-minus text-xs"></i>
            </button>
            <button onclick="changeStockCustom('${item.id}', 'in')" class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-bold flex items-center justify-center transition" title="Tambah Stok">
              <i class="fa-solid fa-plus text-xs"></i>
            </button>
            <button onclick="deleteItem('${item.id}')" class="w-8 h-8 rounded-lg text-slate-300 hover:text-red-500 flex items-center justify-center transition ml-1" title="Hapus Barang">
              <i class="fa-solid fa-trash text-xs"></i>
            </button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function renderHistory() {
      const historyEl = document.getElementById('historyList');
      if (window.historyLog.length === 0) {
        historyEl.innerHTML = `<li class="text-slate-400 italic text-center py-2">Belum ada riwayat transaksi.</li>`;
        return;
      }

      historyEl.innerHTML = window.historyLog.map(h => `
        <li class="flex justify-between items-center py-1.5 border-b border-slate-100 last:border-0">
          <span class="text-slate-700">${h.text}</span>
          <span class="text-[10px] text-slate-400 font-mono ml-2">${h.time}</span>
        </li>
      `).join('');
    }

    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addForm').reset();
    }
  </script>
</body>
</html>
